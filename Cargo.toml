[package]
name = "glsld"
version = "0.1.0"
authors = ["Vostranox"]
edition = "2021"
rust-version = "1.85"
description = "A GLSL language server"
license = "MIT"
repository = "https://github.com/Vostranox/glsld"

[dependencies]
glslang-sys = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8.23"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
